  learning_rate_base: 0.05
  learning_rate_multiplier: 0.15

norepinephrine:
  novelty_scale: 15.0
  cortisol_delta_scale: 0.25

love:
  attachment_threshold: 0.6
  oxytocin_threshold: 60.0
  dopamine_threshold: 60.0

emotion:
  focus_threshold: 0.7
  high_emotion_hits: 3

curiosity:
  bonus_threshold: 0.6
  dopamine_reward: 12.0

reinforcement:
  rpe_dopamine_scale: 5.0
  rpe_dopamine_max_delta: 10.0
  endorphin_regret_scale: 25.0
  endorphin_cortisol_buffering: 0.15
  endorphin_serotonin_boost: 0.1

hopfield:
  neurons: 9
  binarize_threshold: 50.0
  ach_scale_min: 0.3
  ach_scale_max: 1.2
